name: Build

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CleanArchitectureTemplate.slnx

      - name: Audit NuGet dependencies
        shell: bash
        run: |
          vulnerable=0
          while IFS= read -r -d '' project; do
            output=$(dotnet list "$project" package --vulnerable --include-transitive)
            printf '%s\n' "$output"
            if grep -q "has the following vulnerable packages" <<< "$output"; then
              vulnerable=1
            fi
          done < <(find src tests -name '*.csproj' -print0)
          exit "$vulnerable"

      - name: Build
        run: dotnet build CleanArchitectureTemplate.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CleanArchitectureTemplate.slnx --configuration Release --no-restore --no-build

      - name: Publish
        run: dotnet publish CleanArchitectureTemplate.slnx --configuration Release --no-restore --no-build
