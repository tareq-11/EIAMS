name: Build

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  DOTNET_VERSION: "10.0.107"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore pinned .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore CleanArchitectureTemplate.slnx

      - name: Generate CycloneDX SBOM
        run: >-
          dotnet tool run dotnet-CycloneDX CleanArchitectureTemplate.slnx
          --output artifacts/sbom
          --filename bom.json
          --output-format Json
          --disable-package-restore
          --set-name EIAMS
          --set-version "${GITHUB_SHA}"

      - name: Retain SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cyclonedx-sbom-${{ github.sha }}
          path: artifacts/sbom/bom.json
          if-no-files-found: error
          retention-days: 30

      - name: Audit NuGet dependencies
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' project; do
            dotnet package list \
              --project "$project" \
              --vulnerable \
              --include-transitive \
              --format json \
              --no-restore | jq -e '
              (.version == 1) and
              (((.projects // []) | length) == 1) and
              ((.problems // []) | length == 0) and
              ([
                .projects[]?.frameworks[]?.topLevelPackages[]?,
                .projects[]?.frameworks[]?.transitivePackages[]?
              ] | all(((.vulnerabilities // []) | length) == 0))
            ' > /dev/null
          done < <(find src tests -name '*.csproj' -print0)

      - name: Build
        run: dotnet build CleanArchitectureTemplate.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CleanArchitectureTemplate.slnx --configuration Release --no-restore --no-build

      - name: Publish
        run: dotnet publish CleanArchitectureTemplate.slnx --configuration Release --no-restore --no-build
