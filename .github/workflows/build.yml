name: Build

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CleanArchitectureTemplate.slnx

      - name: Audit NuGet dependencies
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' project; do
            dotnet package list \
              --project "$project" \
              --vulnerable \
              --include-transitive \
              --format json \
              --no-restore | jq -e '
              ((.problems // []) | length == 0) and
              ([
                .projects[]?.frameworks[]?.topLevelPackages[]?,
                .projects[]?.frameworks[]?.transitivePackages[]?
              ] | all(((.vulnerabilities // []) | length) == 0))
            ' > /dev/null
          done < <(find src tests -name '*.csproj' -print0)

      - name: Build
        run: dotnet build CleanArchitectureTemplate.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CleanArchitectureTemplate.slnx --configuration Release --no-restore --no-build

      - name: Publish
        run: dotnet publish CleanArchitectureTemplate.slnx --configuration Release --no-restore --no-build
